<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Veelink Audit Ledger</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans p-8 min-h-screen flex flex-col">
  <div class="max-w-5xl mx-auto w-full space-y-6">
    <div class="border-b border-slate-800 pb-4 flex justify-between items-end">
      <div>
        <h1 class="text-2xl font-bold text-white flex items-center gap-3">
          <div class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></div>
          State Interoperability Audit Ledger
        </h1>
        <p class="text-slate-400 text-sm mt-1">Immutable DPDP-compliant transaction logs for Citizen Consent.</p>
      </div>
      <div class="text-right">
        <span class="text-xs font-mono text-cyan-400 bg-cyan-950/30 px-3 py-1 rounded border border-cyan-500/30">NODE: VI-LINK-CORE</span>
      </div>
    </div>

    <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-2xl">
      <table class="w-full text-left text-sm">
        <thead class="bg-slate-950 text-slate-400 font-mono text-xs uppercase border-b border-slate-800">
          <tr>
            <th class="px-4 py-3">Timestamp</th>
            <th class="px-4 py-3">Transaction ID</th>
            <th class="px-4 py-3">Data Vector</th>
            <th class="px-4 py-3">Consent Status</th>
            <th class="px-4 py-3">Cryptographic Seal</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-800 font-mono text-xs" id="ledgerBody">
          <!-- Live logs will inject here -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // Simulating live ledger data for a flawless SIH pitch
    const logs = [
      { id: "TX-DL-8821", vector: "DIGILOCKER ➔ MUNICIPAL", consent: "AUTO_AUTHORIZED", hash: "N/A (NATIVE_VAULT)", time: new Date(Date.now() - 45000).toLocaleTimeString() },
      { id: "TX-VL-9942", vector: "REVENUE_DEPT ➔ MUNICIPAL", consent: "CITIZEN_EXPLICIT", hash: "e3b0c44298fc1c14", time: new Date().toLocaleTimeString() }
    ];

    const tbody = document.getElementById('ledgerBody');
    logs.forEach(log => {
      tbody.innerHTML += `
        <tr class="hover:bg-slate-800/50 transition">
          <td class="px-4 py-3 text-slate-500">${log.time}</td>
          <td class="px-4 py-3 text-cyan-400 font-bold">${log.id}</td>
          <td class="px-4 py-3 text-slate-300">${log.vector}</td>
          <td class="px-4 py-3">
            <span class="${log.consent.includes('AUTO') ? 'text-emerald-400 bg-emerald-400/10 border-emerald-500/20' : 'text-amber-400 bg-amber-400/10 border-amber-500/20'} border px-2 py-1 rounded-full text-[10px]">${log.consent}</span>
          </td>
          <td class="px-4 py-3 text-slate-500">${log.hash}...</td>
        </tr>
      `;
    });
  </script>
</body>
</html>
